    <!-- Prevenção de flash de tema (FOUC) -->
    <script>
      (function () {
        try {
          var k = "imsolar-theme";
          var s = localStorage.getItem(k);
          var sys = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (s === "dark" || ((!s || s === "system") && sys)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO base (sobrescrito por rota via react-helmet-async) -->
    <title>Tarifas de Energia Elétrica do Brasil | IM Solar</title>
